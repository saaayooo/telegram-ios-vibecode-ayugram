name: NVXGram v0.1
on:
  push:
    branches: [master, nvxgram-v0.1]
  workflow_dispatch:
    inputs:
      build_ipa:
        description: 'Build private arm64 IPA after owner configures signing secrets'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Xcode and report runner
        run: |
          set -euo pipefail
          NVX_XCODE=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          test -d "/Applications/Xcode_${NVX_XCODE}.app"
          sudo xcode-select -s "/Applications/Xcode_${NVX_XCODE}.app/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | head -1 | grep -Fx "Xcode ${NVX_XCODE}"
          sw_vers
          uname -m
      - name: Policy and persistence tests
        run: bash nvxgram/test.sh
      - name: Parse changed Swift sources (not a full type check)
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          paths = Path('nvxgram/swift-files.txt').read_text().splitlines()
          subprocess.run(['swiftc', '-frontend', '-parse', *paths], check=True)
          PY
  ipa:
    if: github.event_name == 'workflow_dispatch' && inputs.build_ipa
    needs: verify
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select exact Xcode
        run: |
          NVX_XCODE=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${NVX_XCODE}.app/Contents/Developer"
          xcodebuild -version | head -1 | grep -Fx "Xcode ${NVX_XCODE}"
      - name: Prepare owner credentials in temporary directory
        env:
          NVX_API_ID: ${{ secrets.NVX_API_ID }}
          NVX_API_HASH: ${{ secrets.NVX_API_HASH }}
          NVX_TEAM_ID: ${{ secrets.NVX_TEAM_ID }}
          NVX_CERTIFICATE_P12_BASE64: ${{ secrets.NVX_CERTIFICATE_P12_BASE64 }}
          NVX_CERTIFICATE_PASSWORD: ${{ secrets.NVX_CERTIFICATE_PASSWORD }}
          NVX_PROFILES_ZIP_BASE64: ${{ secrets.NVX_PROFILES_ZIP_BASE64 }}
        run: python3 nvxgram/prepare_build.py
      - name: Build release arm64 IPA
        run: |
          python3 -u build-system/Make/Make.py \
            --cacheDir="$RUNNER_TEMP/nvxgram-bazel-cache" build \
            --configurationPath="$RUNNER_TEMP/nvxgram-signing/configuration.json" \
            --codesigningInformationPath="$RUNNER_TEMP/nvxgram-signing" \
            --configuration=release_arm64 \
            --buildNumber="$GITHUB_RUN_NUMBER" \
            --outputBuildArtifactsPath="$RUNNER_TEMP/nvxgram-artifacts"
      - name: Check bundle, architecture and signature
        run: |
          set -euo pipefail
          unzip -q "$RUNNER_TEMP/nvxgram-artifacts/Telegram.ipa" -d "$RUNNER_TEMP/nvxgram-inspect"
          NVX_APP="$RUNNER_TEMP/nvxgram-inspect/Payload/Telegram.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$NVX_APP/Info.plist")" = org.nvxgram.ios
          lipo -verify_arch arm64 "$NVX_APP/Telegram"
          codesign --verify --deep --strict "$NVX_APP"
          mv "$RUNNER_TEMP/nvxgram-artifacts/Telegram.ipa" "$RUNNER_TEMP/nvxgram-artifacts/NVXGram-v0.1-arm64.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: NVXGram-v0.1-arm64-unverified-on-device
          path: ${{ runner.temp }}/nvxgram-artifacts/NVXGram-v0.1-arm64.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/nvxgram-signing/build.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/nvxgram-signing" "$RUNNER_TEMP/nvxgram-inspect"
